<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Lyrics Overlay</title>
  <link rel="stylesheet" href="css/custom_lyrics_overlay.css" />
</head>
<body>
  <!-- Fixed pool of reusable .cue nodes (created once, in JS, at load —
       see CUE_POOL_SIZE in js/custom_lyrics_overlay.js) so several cues
       with overlapping [start,end) windows can render concurrently
       without ever creating/destroying DOM nodes during playback.
       Position/font/color/outline/shadow/etc. are applied per-cue via
       individual style.* property assignments; text via textContent only.
       This window is permanently click-through and has no interactive
       elements at all. -->
  <div id="cue-pool"></div>
  <script src="js/custom_lyrics_overlay.js"></script>
</body>
</html>
