[package]
name = "soundplyr"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1", features = [ "window-all", "shell-open", "system-tray", "app-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }
base64 = "0.22"
windows = { version = "0.58", features = [
    "Media_Control",
    "Media_Core",
    "Storage_Streams",
    "Foundation",
] }

[build-dependencies]
tauri-build = { version = "1", features = [] }
