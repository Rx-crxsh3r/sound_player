[package]
name = "soundplyr"
version = "0.1.0"
edition = "2021"

[dependencies]
# v1's allowlist-style features ("window-all", "shell-open", etc.) don't
# exist in v2 — permissions moved to the capabilities/*.json system instead
# (see capabilities/). "tray-icon" is the only feature this app still needs
# from the tauri crate itself (system tray is opt-in in v2, not baked into
# core); we don't use shell/fs/dialog plugins since all file I/O here is
# already plain std::fs in our own Rust code.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }
base64 = "0.22"
rustfft = "6"
ureq    = { version = "2", default-features = false, features = ["tls", "json"] }

# ── Platform-specific: media info + audio capture (src/platform/*) ────────
# Windows: SMTC (Media_Control) for media info, WASAPI (cpal) for loopback.
[target.'cfg(target_os = "windows")'.dependencies]
cpal    = "0.15"
windows = { version = "0.58", features = [
    "Media_Control",
    "Media_Core",
    "Storage_Streams",
    "Foundation",
] }

# Linux: MPRIS (zbus — pure Rust, no libdbus needed) for media info,
# PulseAudio monitor-source capture (also covers PipeWire's pulse-compat
# layer) for the visualizer.
[target.'cfg(target_os = "linux")'.dependencies]
# Default features (not pinned further — least likely to fight with
# whatever actually resolves; src/platform/linux.rs only needs the
# zbus::blocking API, which ships in the base crate).
zbus = "4"
libpulse-binding = "2"
libpulse-simple-binding = "2"
# Only for float_window()'s GDK window-type-hint call (see platform/linux.rs) —
# same 0.18 gtk/gdk already pulled in transitively by tauri's wry/webkit2gtk
# backend, so this adds no new build weight.
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }
