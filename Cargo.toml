[package]
name = "clyr_studio"
version = "0.1.0"
edition = "2021"

[dependencies]
# Unlike the main overlay app, this is a normal document editor with a
# real "manage multiple named project files" workflow, so a native Save
# As/Open dialog is worth the one dependency the overlay app deliberately
# avoids. Everything else (.clyr import/export, audio playback) stays on
# plain browser APIs (File.text(), <audio>, Blob + <a download>) — see
# js/main.js — so this is the only plugin this app needs.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
