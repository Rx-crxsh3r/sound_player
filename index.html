<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Overlay</title>
  <link rel="stylesheet" href="css/style.css" />
  <link id="theme-template" rel="stylesheet" href="css/templates/dark.css" />
</head>
<body>

  <div id="app-container">

    <!-- MAIN BAR: full-width, touches top edge, tapered geometry -->
    <div id="main-bar">
      <!-- Idle text: centered in the flat zone -->
      <div id="bar-left">
        <div class="idle-text">~ Idle ~</div>
      </div>

      <!-- EQ visualizer: absolutely anchored to dip bottom, clipped by bar geometry -->
      <!-- Bars are created dynamically by rebuildBars() in main.js -->
      <div id="animated-line" aria-hidden="true"></div>

      <!-- Right slot: track time -->
      <div id="track-time">--:-- / --:--</div>
    </div>

    <!-- POPUP BOX: shown below-left of bar on toggle -->
    <div id="popup-box" class="hidden">
      <div id="album-art" role="img" aria-label="Album art"></div>
      <div class="info-wrapper">
        <div id="track-info">
          <p id="track-title">Track Title</p>
          <p id="track-artist">Artist Name</p>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
        <div id="transport-controls">
          <button class="transport-btn" id="prev-btn" type="button" title="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" y1="5" x2="21" y2="19"/><polyline points="17,5 10,12 17,19"/><polyline points="11,5 4,12 11,19"/></svg>
          </button>
          <button class="transport-btn" id="play-pause-btn" type="button" title="Play/Pause">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="3" height="14" rx="1"/><rect x="15" y="5" width="3" height="14" rx="1"/></svg>
          </button>
          <button class="transport-btn" id="next-btn" type="button" title="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="5" x2="3" y2="19"/><polyline points="7,5 14,12 7,19"/><polyline points="13,5 20,12 13,19"/></svg>
          </button>
        </div>
      </div>
      <button id="close-popup-btn" type="button" aria-label="Close">&#x2715;</button>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
