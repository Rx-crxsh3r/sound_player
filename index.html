<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Overlay</title>
  <link rel="stylesheet" href="css/style.css" />
  <link id="theme-template" rel="stylesheet" href="css/templates/dark.css" />
</head>
<body>

  <div id="app-container">

    <!-- MAIN BAR: full-width, touches top edge, tapered geometry -->
    <div id="main-bar">
      <!-- Idle text: centered in the flat zone -->
      <div id="bar-left">
        <div class="idle-text">~ Idle ~</div>
      </div>

      <!-- EQ visualizer: absolutely anchored to dip bottom, clipped by bar geometry -->
      <!-- Bars are created dynamically by rebuildBars() in main.js -->
      <div id="animated-line" aria-hidden="true"></div>

      <!-- Right slot: track time -->
      <div id="track-time">--:-- / --:--</div>

      <!-- Bar-mode lyrics: current line only, rendered inside this same bar
           panel (not a separate box) when Settings > Lyrics > Display is
           "In the Bar" — the bar grows taller to fit it. Coexists with the
           visualizer (both can be on at once); see #main-bar.showing-bar-lyric
           in css/style.css. -->
      <p id="bar-lyric-line"></p>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
